name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jarvis-studio-gui/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: jarvis-studio-gui/src-tauri
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('jarvis-studio-gui/src-tauri/gen/android/**/*.gradle*', 'jarvis-studio-gui/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Install packages
        working-directory: jarvis-studio-gui
        run: npm ci
      - name: Fixed signing key (so a new APK updates the installed app)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            if printf '%s' "$KS" | tr -d ' \r\n\t"' | base64 -d > /tmp/fixed.keystore 2>/dev/null \
              && keytool -list -keystore /tmp/fixed.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              mkdir -p ~/.android
              cp /tmp/fixed.keystore ~/.android/debug.keystore
              echo "Using the fixed key."
              FP=$(keytool -list -keystore /tmp/fixed.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -i "SHA-256" | sed 's/.*: //' | tr -d ':' | tr 'A-F' 'a-f')
              echo "Fixed key SHA-256: $FP"
              echo "FIXED_FP=$FP" >> "$GITHUB_ENV"
            else
              echo "::warning::ANDROID_KEYSTORE_BASE64 is not a valid keystore (wrong or cut paste). Building with a random key, so this APK cannot update the installed app."
            fi
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK gets a random key and cannot update the installed app."
          fi
      - name: Build APK
        working-directory: jarvis-studio-gui
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: npx tauri android build --debug --apk --target aarch64
      - name: Re-sign APK with the fixed key and verify the certificate
        if: env.FIXED_FP != ''
        working-directory: jarvis-studio-gui
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          for APK in $(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk'); do
            echo "Re-signing $APK"
            "$BT/apksigner" sign --ks /tmp/fixed.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android "$APK"
            GOT=$("$BT/apksigner" verify --print-certs "$APK" | grep -i "certificate SHA-256 digest" | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')
            echo "APK cert SHA-256: $GOT"
            if [ "$GOT" != "$FIXED_FP" ]; then echo "::error::APK cert does not match the fixed key"; exit 1; fi
          done
          echo "APK cert matches the fixed key."
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis-studio-gui/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
