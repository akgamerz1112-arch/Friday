name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jarvis-studio-gui/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: jarvis-studio-gui/src-tauri
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('jarvis-studio-gui/src-tauri/gen/android/**/*.gradle*', 'jarvis-studio-gui/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Install packages
        working-directory: jarvis-studio-gui
        run: npm ci
      - name: Fixed signing key (so a new APK updates the installed app)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            if printf '%s' "$KS" | tr -d ' \r\n\t"' | base64 -d > /tmp/fixed.keystore 2>/dev/null \
              && keytool -list -keystore /tmp/fixed.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              mkdir -p ~/.android
              cp /tmp/fixed.keystore ~/.android/debug.keystore
              echo "Using the fixed key."
            else
              echo "::warning::ANDROID_KEYSTORE_BASE64 is not a valid keystore (wrong or cut paste). Building with a random key, so this APK cannot update the installed app."
            fi
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK gets a random key and cannot update the installed app."
          fi
      - name: Build APK
        working-directory: jarvis-studio-gui
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: npx tauri android build --debug --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis-studio-gui/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
